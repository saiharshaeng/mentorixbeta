name = "mentorix-ai-proxy"
main = "cloudflare-worker/index.js"
compatibility_date = "2026-08-16"
compatibility_flags = ["nodejs_compat"]

# ─────────────────────────────────────────────────────────────────
# HOW TO DEPLOY
# ─────────────────────────────────────────────────────────────────
# 1. Install wrangler:  npm install -g wrangler
# 2. Login:             npx wrangler login
# 3. Add secrets ONE BY ONE (paste key when prompted):
#
#       npx wrangler secret put GROQ_KEY_1
#       npx wrangler secret put GROQ_KEY_2
#       npx wrangler secret put GROQ_KEY_3
#       npx wrangler secret put GROQ_KEY_4
#       npx wrangler secret put CEREBRAS_KEY
#       npx wrangler secret put SAMBANOVA_KEY
#
# 4. Deploy:            npx wrangler deploy
#
# ─────────────────────────────────────────────────────────────────
# OPTIONAL: KV cache for persistent cross-instance caching
# Uncomment after running: npx wrangler kv namespace create AI_CACHE
# ─────────────────────────────────────────────────────────────────
# [[kv_namespaces]]
# binding = "AI_CACHE"
# id = "YOUR_KV_NAMESPACE_ID_HERE"
